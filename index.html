<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR</title>
  <meta name="description" content="Counting down to 13 November, 8 PM">
  <meta name="theme-color" content="#0e1714">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23d2a679' d='M20 4C11 4 4 9 4 20c11 0 16-7 16-16z'/%3E%3C/svg%3E">

  <!-- Link previews (WhatsApp, iMessage, Telegram, Slack, ...).
       Bump ?v= whenever og-image.jpg changes so apps fetch the new one. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ritwikshanker.github.io/countdown/">
  <meta property="og:title" content="AR">
  <meta property="og:description" content="Counting down to 13 November, 8 PM">
  <meta property="og:image" content="https://ritwikshanker.github.io/countdown/og-image.jpg?v=2">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="AR">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    :root {
      color-scheme: dark;
      --bg: #0e1714;
      --green: #1f3b34;
      --blue: #1b2d3b;
      --fg: #eef2ec;
      --muted: #93b1c0;
      --card: rgba(255, 255, 255, 0.04);
      --border: rgba(147, 177, 192, 0.2);
      --accent: #d2a679;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem 1rem;
      background:
        radial-gradient(ellipse at 50% 30%, var(--green), transparent 65%),
        radial-gradient(ellipse at 85% 100%, var(--blue), transparent 55%),
        var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0;
      /* trailing letter-spacing is balanced by the left padding */
      padding-left: 0.25em;
      font-family: var(--serif);
      font-size: clamp(3.5rem, 12vw, 6.5rem);
      font-weight: 400;
      letter-spacing: 0.25em;
      line-height: 1;
      color: var(--accent);
    }
    .divider {
      width: 3rem;
      height: 1px;
      margin: 1.5rem auto;
      background: var(--accent);
      opacity: 0.6;
    }
    .when {
      margin: 0;
      letter-spacing: 0.08em;
      opacity: 0.85;
    }
    .local {
      margin: 0.35rem 0 0;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .timer {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 8rem));
      justify-content: center;
      gap: clamp(0.5rem, 2vw, 1.25rem);
      margin-top: 2.5rem;
    }
    .unit {
      padding: 1.25rem 0.25rem 1rem;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card);
    }
    .value {
      display: block;
      font-size: clamp(2.2rem, 9vw, 4.5rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--accent);
    }
    .label {
      display: block;
      margin-top: 0.5rem;
      font-size: clamp(0.65rem, 2.2vw, 0.75rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .done {
      margin: 2.5rem 0 0;
      font-family: var(--serif);
      font-size: clamp(2rem, 7vw, 3.5rem);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>AR</h1>
    <div class="divider" aria-hidden="true"></div>
    <p class="when">13 November · 8:00 PM IST</p>
    <p class="local" id="local" hidden></p>

    <div class="timer" id="timer" role="timer">
      <div class="unit"><span class="value" id="days">--</span><span class="label">Days</span></div>
      <div class="unit"><span class="value" id="hours">--</span><span class="label">Hours</span></div>
      <div class="unit"><span class="value" id="minutes">--</span><span class="label">Minutes</span></div>
      <div class="unit"><span class="value" id="seconds">--</span><span class="label">Seconds</span></div>
    </div>

    <p class="done" id="done" hidden>It's time</p>
  </main>

  <script>
    // 8 PM India Standard Time (UTC+05:30)
    const TARGET = new Date("2026-11-13T20:00:00+05:30");

    const $ = (id) => document.getElementById(id);
    const pad = (n) => String(n).padStart(2, "0");

    // Only spell out the local time for viewers outside IST
    if (TARGET.getTimezoneOffset() !== -330) {
      $("local").textContent = TARGET.toLocaleString(undefined, {
        dateStyle: "full",
        timeStyle: "short",
      }) + " your time";
      $("local").hidden = false;
    }

    function tick() {
      const ms = TARGET - Date.now();

      if (ms <= 0) {
        $("timer").hidden = true;
        $("done").hidden = false;
        return;
      }

      const total = Math.floor(ms / 1000);
      $("days").textContent = Math.floor(total / 86400);
      $("hours").textContent = pad(Math.floor(total / 3600) % 24);
      $("minutes").textContent = pad(Math.floor(total / 60) % 60);
      $("seconds").textContent = pad(total % 60);

      // Re-run just after the next whole second ticks over
      setTimeout(tick, (ms % 1000) + 20);
    }

    tick();
  </script>
</body>
</html>
